name: Deploy na VPS

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar a landing
    runs-on: [self-hosted, vps-sala]
    env:
      NEXT_PUBLIC_SITE_URL: https://www.asaladosbuscadores.com.br
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - name: Baixando o código
        uses: actions/checkout@v4
      - name: Preparando Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalando dependências
        run: npm ci
      - name: Gerando o site estático
        run: npm run build
      - name: Publicando na VPS
        run: ./deploy/publicar.sh
      - name: Conferindo se a landing está no ar
        run: curl -fsS -o /dev/null -w "A landing respondeu HTTP %{http_code}.\n" https://www.asaladosbuscadores.com.br/
      - name: Deploy concluído
        run: echo "Deploy concluído. A landing está no ar em https://www.asaladosbuscadores.com.br"
      - name: Aviso de falha
        if: failure()
        run: echo "O deploy não foi concluído. Veja o log do passo que falhou acima."
